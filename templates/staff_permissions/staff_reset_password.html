{% extends 'base.html' %}

{% block title %}Reset Staff Password | PlaceSync{% endblock %}

{% block content %}
<div class="container" style="flex: 1; padding: 2rem 1.5rem; max-width: 600px;">
    
    <!-- Header -->
    <div class="dashboard-header" style="border-bottom: none; margin-bottom: 2rem;">
        <div>
            <h1 class="dashboard-title">🔑 Reset Staff Password</h1>
            <p class="dashboard-welcome">Set a new password for staff account <strong>@{{ staff.user.username }}</strong>.</p>
        </div>
    </div>

    <!-- Form Panel -->
    <div class="card-panel" style="margin-top: 0; padding: 2rem;">
        <form method="post" style="display: flex; flex-direction: column; gap: 1.5rem;">
            {% csrf_token %}

            <!-- Password -->
            <div>
                <label for="password" style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 600;">New Password *</label>
                <input type="password" id="password" name="password" required placeholder="Enter new password" class="form-control" style="width: 100%;">
            </div>

            <!-- Confirm Password -->
            <div>
                <label for="confirm_password" style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 600;">Confirm Password *</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm new password" class="form-control" style="width: 100%;">
            </div>

            <!-- Actions -->
            <div style="display: flex; gap: 0.75rem; border-top: 1px solid var(--card-border); padding-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="padding: 0.6rem 1.5rem;">Save Password</button>
                <a href="{% url 'staff_permissions:staff_list' %}" class="btn btn-secondary" style="padding: 0.6rem 1.5rem;">Cancel</a>
            </div>

        </form>
    </div>

</div>
{% endblock %}
