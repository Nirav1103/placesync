{% extends 'base.html' %}
{% load staff_tags %}

{% block title %}Change Password | PlaceSync{% endblock %}

{% block content %}
<div class="container" style="flex: 1; padding: 2rem 1.5rem; max-width: 600px;">

    <!-- Header -->
    <div class="dashboard-header" style="border-bottom: none; margin-bottom: 2rem;">
        <div>
            <h1 class="dashboard-title">🔑 Change Password</h1>
            <p class="dashboard-welcome">Update your current account password.</p>
        </div>
    </div>

    <!-- Form Panel -->
    <div class="card-panel" style="margin-top: 0; padding: 2rem;">
        <form method="post" style="display: flex; flex-direction: column; gap: 1.5rem;">
            {% csrf_token %}

            <!-- Current Password -->
            <div>
                <label for="current_password"
                    style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 600;">Current
                    Password *</label>
                <input type="password" id="current_password" name="current_password" required
                    placeholder="Enter current password" class="form-control" style="width: 100%;">
            </div>

            <!-- New Password -->
            <div>
                <label for="new_password"
                    style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 600;">New
                    Password *</label>
                <input type="password" id="new_password" name="new_password" required placeholder="Enter new password"
                    class="form-control" style="width: 100%;">
            </div>

            <!-- Confirm Password -->
            <div>
                <label for="confirm_password"
                    style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 600;">Confirm
                    New Password *</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    placeholder="Re-type new password" class="form-control" style="width: 100%;">
            </div>

            <!-- Actions -->
            <div style="display: flex; gap: 0.75rem; border-top: 1px solid var(--card-border); padding-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="padding: 0.6rem 1.5rem;">Change Password</button>
                <a href="{% if request.user|is_college_admin_filter %}{% url 'staff_permissions:settings' %}{% else %}{% url 'dashboard:index' %}{% endif %}"
                    class="btn btn-secondary" style="padding: 0.6rem 1.5rem;">Cancel</a>
            </div>

        </form>
    </div>

</div>
{% endblock %}
