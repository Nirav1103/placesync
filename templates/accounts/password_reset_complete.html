{% extends 'base.html' %}

{% block title %}Password Reset Complete | PlaceSync{% endblock %}

{% block content %}
<div class="auth-wrapper" style="padding-top: 4rem;">
    <div class="auth-card" style="text-align: center; max-width: 480px; background:#FFFFFF !important; border:1.5px solid #475569 !important; border-radius:12px; padding:2.5rem; margin:0 auto;">
        <div class="auth-header" style="margin-bottom:1.5rem;">
            <h1 class="auth-title" style="color:#0F172A !important; font-weight:800; font-size:1.5rem;">Password Reset Complete</h1>
            <p class="auth-subtitle" style="margin-top: 1rem; line-height: 1.6; color:#1E293B !important; font-weight:600; font-size:0.9rem;">
                Your password has been reset successfully. You can now use your new password to log in.
            </p>
        </div>

        <a href="{% url 'accounts:login' %}" class="sp-btn sp-btn-primary btn-block" style="padding: 0.85rem; width:100%; font-weight:800; text-decoration:none; display:block;">Log In</a>
    </div>
</div>
{% endblock %}
